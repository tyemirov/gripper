name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64   go build -ldflags='-s -w' -o dist/gripper_linux_amd64   ./
          GOOS=darwin  GOARCH=amd64   go build -ldflags='-s -w' -o dist/gripper_darwin_amd64  ./
          GOOS=darwin  GOARCH=arm64   go build -ldflags='-s -w' -o dist/gripper_darwin_arm64 ./
          GOOS=windows GOARCH=amd64   go build -ldflags='-s -w' -o dist/gripper_windows_amd64.exe ./

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gripper-${{ github.ref_name }}
          path: dist
