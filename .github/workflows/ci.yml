name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Verify formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        env:
          CGO_ENABLED: 0
        run: go test ./...

  build:
    name: Build Unix Binaries
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o dist/gripper-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gripper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/gripper-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
